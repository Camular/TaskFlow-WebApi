version: '3.8'

services:

  taskflow-db:
    image: postgres:16-alpine
    container_name: taskflow_postgres_container
    environment:
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_NAME}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  taskflow-pgadmin:
    image: dpage/pgadmin4
    container_name: taskflow_pgadmin_container
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_EMAIL}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD}"
    ports:
      - "5050:80"
    depends_on:
      - taskflow-db


volumes:
  postgres_data: